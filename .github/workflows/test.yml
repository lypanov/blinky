name: Continuous Integration

on:
  push:
    tags: ['*']
    branches: ['main']
  pull_request:
  workflow_dispatch:

env:
  verilator-version: v5.022
  verilator-install-dir: verilator-install

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cleanup
        run: sed -i "s/%NAME%/test/g" build.mill
      - name: Cache Scala
        uses: coursier/cache-action@v6
      - name: Setup Scala
        uses: coursier/setup-action@v1
        with:
          jvm: adopt:11
      - name: Setup Mill
        run: |
          curl -L https://github.com/com-lihaoyi/mill/releases/download/0.12.5/0.12.5 > mill && chmod +x mill
      - name: Setup Dependencies
        run: |
          sudo apt-get install ccache
      - name: Cache Norebo
        uses: actions/cache@v4
        with:
          path: tools/project-norebo
          key: norebo-${{ hashFiles('tools/norebo.pin') }}
      - name: Build pinned Norebo and check raw .rsc code
        run: |
          tools/setup_norebo.sh
          python3 tools/verify_raw_oberon_code.py
      - name: Check BL fixup matches Modules.Mod
        run: python3 tools/test_bl_fixup.py
      - name: Check AMMT BEGIN trampoline zeros light
        run: python3 sim/test_ammt_init.py
      - name: Check BL writes R15 and Blink3 toggles
        run: python3 sim/test_bl_r15.py
      - name: Get Cached Verilator
        id: get-cached-verilator
        uses: actions/cache@v4
        with:
          path: ${{ env.verilator-install-dir }}
          key: verilator-${{ env.verilator-version }}
      - name: Install Verilator
        if: steps.get-cached-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install git help2man perl python3 make autoconf g++ flex bison numactl perl-doc libfl-dev
          git clone https://github.com/verilator/verilator
          unset VERILATOR_ROOT
          cd verilator
          git checkout ${{ env.verilator-version  }}
          autoconf
          ./configure --prefix=$(pwd)/../${{ env.verilator-install-dir }}
          make
          make install
      - name: Set PATH
        run: |
          echo "$(pwd)/${{ env.verilator-install-dir }}/bin" >> $GITHUB_PATH
          echo VERILATOR_ROOT="$(pwd)/${{ env.verilator-install-dir }}/share/verilator" >> $GITHUB_ENV
          ln -sf $(pwd)/${{ env.verilator-install-dir }}/bin/verilator_bin $(pwd)/${{ env.verilator-install-dir }}/share/verilator/verilator_bin
      # This repo is Mill, not sbt. `sbt test` has no build.sbt and uses Scala
      # 2.12, which rejects numeric underscores in Blinky.scala (27_000_000).
      # That failure is identical on main / a68a501; mill uses Scala 2.13.15.
      - name: mill Test
        env:
          CHISEL_CPU_PROJECT_ROOT: ${{ github.workspace }}
        run: ./mill _.test
